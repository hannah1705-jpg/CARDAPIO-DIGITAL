<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Espetaria Bom Gosto | Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #a3a3a3;
    --line: #2b2b2b;
    --display: "Anton", Impact, "Arial Narrow", sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* sem zoom: trava pinça e toque duplo, e evita o aumento automático de texto */
  html {
    touch-action: pan-x pan-y;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 96px);
    scroll-behavior: smooth;
    overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    touch-action: pan-x pan-y;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px 44px; overflow-x: clip; }

  header { padding: 32px 0 22px; }
  header h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(48px, 15vw, 88px);
    line-height: .92;
    letter-spacing: .01em;
    margin: 0;
    text-transform: uppercase;
  }
  header p { margin: 12px 0 0; color: var(--muted); font-size: 15px; max-width: 30em; }

  .qr {
    margin-top: 18px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    border: 1.5px solid var(--fg);
    border-radius: 14px;
    padding: 12px 18px 12px 12px;
  }
  #qrcode { background: #fff; padding: 5px; border-radius: 8px; line-height: 0; min-width: 40px; min-height: 40px; }
  #qrcode img, #qrcode canvas { display: block; }
  .qr span { font-size: 14px; color: var(--muted); max-width: 12em; }

  nav {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    padding: 8px 16px;
    margin: 0 -16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    border-bottom: 1px solid var(--line);
  }
  nav a {
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
    font-size: 12px;
    text-align: center;
    padding: 6px 2px;
    border: 1.5px solid var(--fg);
    border-radius: 999px;
    white-space: nowrap;
  }
  nav a.on { background: var(--fg); color: var(--bg); }
  nav a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  section { padding-top: 34px; }
  section h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 42px;
    line-height: 1;
    margin: 0 0 12px;
    text-transform: uppercase;
  }
  /* espeto: linha fina com a ponta em bolinha */
  .espeto { display: flex; align-items: center; }
  .espeto::before { content: ""; flex: 1; height: 2px; background: var(--fg); }
  .espeto::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); margin-left: -1px; }
  .nota { color: var(--muted); font-size: 15px; margin: 12px 0 0; }

  .sub { font-weight: 600; font-size: 14px; color: var(--muted); margin: 20px 0 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .nome { font-size: 15.5px; flex: 0 1 auto; min-width: 0; }
  .pts { flex: 1 1 10px; border-bottom: 1px dotted #444; transform: translateY(-3px); min-width: 8px; }
  .preco { font-family: var(--display); font-size: 18px; letter-spacing: .01em; white-space: nowrap; flex: 0 0 auto; }

  footer { margin-top: 36px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Espetaria<br>Bom Gosto</h1>
    <p>Espetinhos na brasa, bebidas geladas e porções pra dividir. Escaneie ou role pra ver tudo.</p>
    <div class="qr">
      <div id="qrcode"></div>
      <span>Aponte a câmera para abrir este cardápio no celular.</span>
    </div>
  </header>

  <nav id="nav"></nav>
  <main id="menu"></main>

  <footer>Cardápio sujeito a alteração sem aviso prévio. Consulte o garçom.</footer>
</div>

<script>
  var DATA = [{"id": "espetos", "title": "Espetos", "note": "Servidos na brasa, no palito.", "groups": [{"sub": "Carnes", "items": [["Alcatra", "R$ 13,00", "alcatra"], ["Carne de sol", "R$ 13,00", "carne-de-sol"], ["Carne de sol com bacon", "R$ 13,00", "carne-de-sol-com-bacon"], ["Contra filé", "R$ 13,00", "contra-file"], ["Cupim", "R$ 13,00", "cupim"], ["Picanha montada", "R$ 13,00", "picanha-montada"]]}, {"sub": "Frango", "items": [["Coração", "R$ 13,00", "coracao"], ["Frango com bacon", "R$ 13,00", "frango-com-bacon"], ["Frango tradicional", "R$ 13,00", "frango-tradicional"], ["Meio da asa", "R$ 13,00", "meio-da-asa"]]}, {"sub": "Linguiça", "items": [["Linguiça apimentada", "R$ 13,00", "linguica-apimentada"], ["Linguiça toscana", "R$ 13,00", "linguica-toscana"]]}, {"sub": "Queijo", "items": [["Queijo coalho", "R$ 13,00", "queijo-coalho"], ["Queijo provolone", "R$ 13,00", "queijo-provolone"]]}, {"sub": "Especiais", "items": [["Kafta de carne", "R$ 14,00", "kafta-de-carne"], ["Kafta de frango", "R$ 14,00", "kafta-de-frango"], ["Cupim nobre", "R$ 23,00", "cupim-nobre"], ["Picanha nobre", "R$ 23,00", "picanha-nobre"]]}], "nav": "Espetos"}, {"id": "guarnicoes", "title": "Guarnições", "note": "", "groups": [{"sub": "", "items": [["Arroz", "R$ 6,00", "arroz"], ["Mandioca", "R$ 6,00", "mandioca"], ["Vinagrete", "R$ 6,00", "vinagrete"], ["Feijão tropeiro", "R$ 7,00", "feijao-tropeiro"]]}], "nav": "Guarnições"}, {"id": "porcao", "title": "Porção KG", "note": "", "groups": [{"sub": "", "items": [["Arroz KG", "R$ 22,00", "arroz"], ["Mandioca KG", "R$ 22,00", "mandioca"], ["Vinagrete KG", "R$ 22,00", "vinagrete"], ["Feijão tropeiro KG", "R$ 36,00", "feijao-tropeiro"]]}], "nav": "Porção KG"}, {"id": "jantinha", "title": "Jantinha", "note": "", "groups": [{"sub": "", "items": [["Jantinha sem espeto", "R$ 18,00", "jantinha-sem-espeto"], ["Jantinha", "R$ 27,00", "jantinha"], ["Jantinha c/ kafta de carne", "R$ 28,00", "jantinha-c-kafta-de-carne"], ["Jantinha c/ kafta de frango", "R$ 28,00", "jantinha-c-kafta-de-frango"], ["Jantinha cupim nobre", "R$ 38,00", "jantinha-cupim-nobre"], ["Jantinha picanha nobre", "R$ 38,00", "jantinha-picanha-nobre"]]}], "nav": "Jantinha"}, {"id": "bebidas", "title": "Bebidas", "note": "", "groups": [{"sub": "", "items": [["Água mineral", "R$ 3,00", "agua-mineral"], ["Água com gás", "R$ 4,00", "agua-com-gas"], ["Água tônica 350ml", "R$ 6,50", "agua-tonica-350ml"], ["Coca-Cola KS", "R$ 5,50", "coca-cola"], ["Coca-Cola 350ml", "R$ 6,50", "coca-cola"], ["Coca-Cola Zero 350ml", "R$ 6,50", "coca-cola-zero"], ["Coca-Cola 600ml", "R$ 7,50", "coca-cola"], ["Coca-Cola Zero 600ml", "R$ 7,50", "coca-cola-zero"], ["Coca-Cola 1L", "R$ 10,00", "coca-cola"], ["Coca-Cola Zero 1L", "R$ 10,00", "coca-cola-zero"], ["Coca-Cola 2L", "R$ 15,00", "coca-cola"], ["Coca-Cola Zero 2L", "R$ 15,00", "coca-cola-zero"], ["Fanta Laranja 350ml", "R$ 6,50", "fanta-laranja"], ["Fanta Uva 350ml", "R$ 6,50", "fanta-uva"], ["Fanta 600ml", "R$ 7,50", "fanta-laranja"], ["Fanta Laranja 2L", "R$ 12,00", "fanta-laranja"], ["Guaraná 350ml", "R$ 6,50", "guarana"], ["Guaraná Zero 350ml", "R$ 6,50", "guarana-zero"], ["Guaraná 600ml", "R$ 7,50", "guarana"], ["Guaraná Zero 600ml", "R$ 7,50", "guarana-zero"], ["Guaraná 1L", "R$ 10,00", "guarana"], ["Guaraná 2L", "R$ 12,00", "guarana"], ["Guaraná Mineiro 2L", "R$ 12,00", "guarana-mineiro"], ["Sprite Limão 350ml", "R$ 6,50", "sprite-limao-350ml"], ["H2O", "R$ 7,50", "h2o"], ["Limoneto", "R$ 7,50", "limoneto"], ["Red Bull", "R$ 13,00", "red-bull"], ["Suco de caixinha", "R$ 4,00", "suco-de-caixinha"], ["Suco La Fruit 1L", "R$ 8,00", "suco-la-fruit-1l"], ["Copo suco de laranja", "R$ 10,00", "suco-de-laranja"], ["Jarra 1L de laranja", "R$ 17,00", "suco-de-laranja"]]}], "nav": "Bebidas"}, {"id": "alcoolicas", "title": "Bebidas alcoólicas", "note": "", "groups": [{"sub": "", "items": [["Cerveja Skol", "R$ 4,00", "cerveja-skol"], ["Cerveja Antarctica", "R$ 4,00", "cerveja-antarctica"], ["Cerveja Amstel", "R$ 5,50", "cerveja-amstel"], ["Cerveja Brahma", "R$ 5,50", "cerveja-brahma"], ["Original 350ml", "R$ 5,50", "original-350ml"], ["Cerveja Heineken", "R$ 6,50", "heineken"], ["Preparo Cozumel", "R$ 7,00", "preparo-cozumel"], ["Cozumel", "R$ 10,90", "cozumel"], ["Cerveja Budweiser Long Neck", "R$ 8,00", "cerveja-budweiser-long-neck"], ["Cerveja Sol Long Neck", "R$ 8,00", "cerveja-sol-long-neck"], ["Cerveja Stella Long Neck", "R$ 8,00", "stella"], ["Cerveja Heineken Long Neck", "R$ 9,00", "heineken"], ["Stella Gold", "R$ 9,00", "stella-gold"], ["Cerveja Corona Long Neck", "R$ 9,50", "cerveja-corona-long-neck"], ["Cerveja Smirnoff", "R$ 10,00", "cerveja-smirnoff"], ["Ice", "R$ 10,00", "ice"], ["Keep Cooler", "R$ 10,00", "keep-cooler"]]}], "nav": "Alcoólicas"}, {"id": "diversos", "title": "Diversos", "note": "", "groups": [{"sub": "", "items": [["Doces diversos", "R$ 4,00", "doces-diversos"]]}], "nav": "Diversos"}];

  var nav = document.getElementById("nav");
  var menu = document.getElementById("menu");
  var navHtml = "", menuHtml = "";

  DATA.forEach(function (s) {
    navHtml += '<a href="#' + s.id + '">' + s.nav + '</a>';
    menuHtml += '<section id="' + s.id + '"><h2>' + s.title + '</h2><div class="espeto"></div>';
    if (s.note) menuHtml += '<p class="nota">' + s.note + '</p>';
    s.groups.forEach(function (g) {
      if (g.sub) menuHtml += '<p class="sub">' + g.sub + '</p>';
      menuHtml += '<ul>';
      g.items.forEach(function (i) {
        menuHtml += '<li><span class="nome">' + i[0] + '</span><span class="pts"></span><span class="preco">' + i[1] + '</span></li>';
      });
      menuHtml += '</ul>';
    });
    menuHtml += '</section>';
  });
  nav.innerHTML = navHtml;
  menu.innerHTML = menuHtml;

  // QR code (mesmo link do arquivo original)
  try {
    new QRCode(document.getElementById("qrcode"), {
      text: "https://hannah1705-jpg.github.io/CARDAPIO-DIGITAL/cardapio-3.html",
      width: 84, height: 84,
      colorDark: "#000000", colorLight: "#ffffff"
    });
  } catch (e) {
    var q = document.querySelector(".qr"); if (q) q.style.display = "none";
  }

  // destaca a aba da seção visível
  var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
  var secoes = DATA.map(function (s) { return document.getElementById(s.id); });
  var ultimo = -1;
  function marca() {
    var atual = 0;
    secoes.forEach(function (s, idx) {
      if (s.getBoundingClientRect().top < window.innerHeight * 0.4) atual = idx;
    });
    if (atual === ultimo) return;
    ultimo = atual;
    links.forEach(function (a, idx) { a.classList.toggle("on", idx === atual); });
  }
  window.addEventListener("scroll", marca, { passive: true });
  marca();
</script>
</body>
</html>
